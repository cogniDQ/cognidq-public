# SonarQube project configuration for CogniDQ.
#
# Works out of the box against a local, self-hosted SonarQube Community
# Edition instance (free): start the server, then from the repo root run
#   sonar-scanner
# with SONAR_HOST_URL and SONAR_TOKEN set in the environment (a user token
# generated from My Account > Security in the SonarQube UI).
#
# To use SonarCloud instead, uncomment sonar.organization below, set it to
# your SonarCloud org key, and point SONAR_HOST_URL at https://sonarcloud.io
# with a SONAR_TOKEN generated there (there is no CI workflow for this —
# local/manual analysis only).
#sonar.organization=CHANGEME-sonarcloud-org
sonar.projectKey=cognidq-public
sonar.projectName=CogniDQ

# Source and test locations.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests,frontend/src

# Only frontend files under src/**/*.test.ts(x) or __tests__ are treated as
# tests; everything else in frontend/src is treated as source, which is why
# sonar.test.inclusions narrows the test path instead of splitting the dir.
sonar.test.inclusions=backend/tests/**,frontend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/__tests__/**

sonar.python.version=3.11

# Generated / vendored / non-source content excluded from analysis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,\
  backend/alembic/versions/**,\
  frontend/playwright-report/**,frontend/test-results/**,\
  docs/**,examples/**,seed-data/**,monitoring/**,qa/**,release-notes/**

# Coverage reports are not currently generated in CI. Once backend
# (pytest-cov, coverage.xml) and frontend (vitest --coverage, lcov.info)
# coverage are wired up, point Sonar at them here, e.g.:
# sonar.python.coverage.reportPaths=backend/coverage.xml
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
