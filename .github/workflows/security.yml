name: Security

on:
  push:
    branches: [open-source, main]
  pull_request:
    branches: [open-source, main]
  schedule:
    # Run daily at 03:17 UTC to catch new findings even without commits.
    - cron: "17 3 * * *"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use --redact so leaked secrets never end up in the action log
          # if the action runs against a PR from a fork.
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_NOTIFY_USER_LIST: ""
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Use the project-level config so allowlists are applied
          GITLEAKS_CONFIG: .gitleaks.toml

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict || true

  npm-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high severity)
        run: npm audit --audit-level=high || true
