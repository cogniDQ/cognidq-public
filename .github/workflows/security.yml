name: Security

on:
  push:
    branches: [open-source, main]
  pull_request:
    branches: [open-source, main]
  schedule:
    # Run daily at 03:17 UTC to catch new findings even without commits.
    - cron: "17 3 * * *"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use --redact so leaked secrets never end up in the action log
          # if the action runs against a PR from a fork.
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_NOTIFY_USER_LIST: ""
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Use the project-level config so allowlists are applied
          GITLEAKS_CONFIG: .gitleaks.toml

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict || true

  npm-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high severity)
        run: npm audit --audit-level=high || true

  bandit:
    name: Python security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install "bandit[toml]==1.8.3"

      # Blocking: high severity + high confidence findings must not exist.
      - name: Bandit (high severity/confidence)
        run: bandit -c pyproject.toml -r backend/app --severity-level high --confidence-level high

      # Informational: medium+ findings are tracked as pre-existing debt
      # (dynamic SQL identifier interpolation reviewed as by-design for the
      # rule-preview engine, hardcoded /tmp defaults, dev-only 0.0.0.0 bind).
      # See the audit report for the full list; do not silently widen this
      # to `|| true` without triaging new findings first.
      - name: Bandit (medium+ severity/confidence, non-blocking)
        run: bandit -c pyproject.toml -r backend/app --severity-level medium --confidence-level medium
        continue-on-error: true

  semgrep:
    name: Security patterns (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Informational: full report at default severity so nothing is hidden.
      - name: Semgrep (full report)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/python \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/dockerfile

      # Blocking: only fail CI on high-confidence (ERROR-severity) findings.
      - name: Semgrep (fail on high-confidence findings)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/python \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/dockerfile \
            --severity=ERROR \
            --error

  trivy-fs:
    name: Filesystem & dependency scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Secret scanning is owned by gitleaks (above) to avoid two tools
          # fighting over the same allowlist; trivy covers deps + misconfig.
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          # Non-blocking for this initial rollout: the existing dependency
          # tree already carries a real, sizeable backlog (see the audit
          # report) that needs a dedicated triage pass, not a silent
          # exclusion. Findings are still fully printed below on every run.
          # Flip to "1" once the backlog is cleared or explicitly accepted.
          exit-code: "0"
          format: table
          skip-dirs: frontend/node_modules,frontend/dist,backend/.venv

  trivy-image:
    name: Docker image scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: cognidq-${{ matrix.name }}:ci

      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cognidq-${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          # Non-blocking for the same reason as trivy-fs above.
          exit-code: "0"
          format: table
