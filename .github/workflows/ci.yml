name: CI

on:
  push:
    branches: [open-source, main]
  pull_request:
    branches: [open-source, main]

# Cancel in-progress runs for the same ref when a new push comes in.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Backend: lint, type-check, unit tests
  # ---------------------------------------------------------------
  backend:
    name: backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # gitleaks:allow
          POSTGRES_DB: dataquality_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.5 pytest pytest-cov

      - name: Generate CI test encryption keys
        run: |
          python -c "
          from cryptography.fernet import Fernet
          k = Fernet.generate_key().decode()
          print(f'CI_DATASOURCE_KEY={k}')
          print(f'CI_CREDENTIAL_KEY={k}')
          " >> $GITHUB_ENV

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dataquality_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-unit-test-only # gitleaks:allow
          DATASOURCE_ENCRYPTION_KEY: ${{ env.CI_DATASOURCE_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ env.CI_CREDENTIAL_KEY }}
          OPENAI_API_KEY: ci-no-openai-key # gitleaks:allow
        run: pytest -q -m "not integration and not e2e"

  # ---------------------------------------------------------------
  # Frontend: install, lint, type-check, build, unit tests
  # ---------------------------------------------------------------
  frontend:
    name: frontend (lint + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      # Type-checking is reported but non-blocking for now: this codebase
      # carries pre-existing type debt being paid down incrementally. The
      # production bundle is validated by the Build step below (esbuild).
      - name: Type-check
        run: npm run typecheck --if-present
        continue-on-error: true

      - name: Unit tests
        run: npm run test --if-present -- --run

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # Docker Compose configuration validation
  # ---------------------------------------------------------------
  compose:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        env:
          OPENAI_API_KEY: ci-placeholder
          DATASOURCE_ENCRYPTION_KEY: ci-placeholder
          CREDENTIAL_ENCRYPTION_KEY: ci-placeholder
          MINIO_ROOT_PASSWORD: ci-placeholder
          GF_SECURITY_ADMIN_PASSWORD: ci-placeholder
          FLOWER_BASIC_AUTH: ci-placeholder:ci-placeholder
        run: docker compose config --quiet

  # ---------------------------------------------------------------
  # Aggregate gate
  # ---------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    steps:
      - run: echo "All required CI jobs passed."
