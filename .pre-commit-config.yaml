# Pre-commit configuration for CogniDQ
# Install once with:  pip install pre-commit && pre-commit install
# Run on demand with: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(frontend/test-results/|.*\.svg$)
      - id: end-of-file-fixer
        exclude: ^(frontend/test-results/|.*\.svg$)
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend ESLint
        language: system
        entry: bash -c 'cd frontend && npx --no -- eslint --max-warnings=0 "$@"' --
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
        require_serial: true
        pass_filenames: true
