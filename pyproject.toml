# Repository-wide tooling configuration shared by ruff and friends.
# Per-package configuration (e.g. backend's own pyproject) takes precedence
# inside that package; this file applies at the repo root.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "frontend",
    "documentation",
    "docs",
    "examples",
    "seed-data",
    "qa",
    "e2e_subtypes",
    "ai_delivery",
    "todo-lists",
    "monitoring",
    "scripts/_oss_*",
    "*.ipynb_checkpoints",
]

[tool.ruff.lint]
# Conservative rule set for an existing codebase. Tighten over time.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length is enforced by formatter, not the linter
    "B008",  # function calls in default arguments (FastAPI pattern)
    "W291",  # trailing whitespace (owned by formatter; residue lives in string literals)
    # --- Deferred for this existing codebase; tighten over time (issue: lint debt) ---
    "B904",  # raise ... from err inside except — pervasive, non-functional
    "B905",  # zip() without explicit strict=
    "B007",  # unused loop control variable
    "B017",  # assert pytest.raises(Exception) in existing tests
    "E402",  # module-level import not at top (intentional sys.path / lazy setup)
    "E711",  # comparison to None (legacy SQLAlchemy-style filters)
    "E712",  # comparison to True/False (legacy SQLAlchemy-style filters)
    "E722",  # bare except in legacy code paths
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    "UP007", # X | Y unions (gradual migration)
    "UP017", # datetime.UTC alias (requires 3.11+, prefer timezone.utc for clarity)
    "UP035", # deprecated typing imports (gradual migration)
    "UP042", # str enum (would require base-class changes)
]

[tool.ruff.lint.per-file-ignores]
# Tests can use unused imports / fixture patterns and late (function-scoped) imports.
"backend/tests/**" = ["F401", "F811", "F821"]
# Migrations are autogenerated.
"backend/alembic/**" = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
markers = [
    "integration: end-to-end tests that need the docker-compose stack",
    "e2e: full-stack e2e tests that hit the running API",
    "slow: tests that take >1s",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
